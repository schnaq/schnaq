name: Dependency Review

on:
  pull_request:
    branches: [develop, deploy]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          allow-licenses: >-
            MIT,
            MIT-0,
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            ISC,
            EPL-1.0,
            EPL-2.0,
            CC0-1.0,
            Unlicense,
            0BSD,
            MPL-2.0,
            OFL-1.1,
            CC-BY-3.0,
            CC-BY-4.0,
            Python-2.0,
            Zlib
