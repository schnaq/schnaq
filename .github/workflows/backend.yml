name: "Docker: Build Backend Images"

on:
  # Deploy no longer builds automatically: the charts repository pins backend
  # images by their develop SHA, so merging develop into deploy produced an
  # image nobody pulled. Use this trigger to build a one-off ref by hand.
  workflow_dispatch:
  push:
    branches:
      - develop
    tags:
      - v*

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Push image to GitHub Packages.
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # git describe needs the tags and the history back to the last one.
          fetch-depth: 0
      - name: Determine version
        run: echo "APP_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: "arm64"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
          tags: |
            type=raw,value=staging,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          file: Dockerfile.backend
          build-args: |
            BUILD_HASH=${{ github.sha }}
            APP_VERSION=${{ env.APP_VERSION }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
