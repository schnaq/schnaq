name: Delete old container images

on:
  schedule:
    # Weekly, Monday 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run without deleting (preview only)
        type: boolean
        default: false

# The job token may delete versions of packages this repository administers,
# so no personal access token has to be kept alive.
permissions:
  packages: write

jobs:
  clean-ghcr:
    name: Delete old unused container images
    runs-on: ubuntu-latest
    steps:
      - name: Delete old containers
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: schnaq
          # The job token cannot list packages, so names must be exact.
          # Packages of other repositories need their own cleanup.
          image-names: "schnaq/backend"
          # Only delete untagged versions. The charts pin images by their
          # sha-* tag, so deleting tagged versions pulled the image out from
          # under a running production pod (ImagePullBackOff on restart).
          tag-selection: untagged
          cut-off: 4w
          token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ inputs.dry-run || false }}
