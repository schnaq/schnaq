name: Delete old container images

on:
  schedule:
    # Weekly, Monday 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run without deleting (preview only)
        type: boolean
        default: false

jobs:
  clean-ghcr:
    name: Delete old unused container images
    runs-on: ubuntu-latest
    steps:
      - name: Delete old containers
        uses: snok/container-retention-policy@v3.0.1
        with:
          account: schnaq
          image-names: "*"
          # Never delete the canonical tags that production / staging
          # currently point at; everything else is fair game past the
          # retention cutoff.
          image-tags: "!latest !staging"
          cut-off: 4w
          keep-n-most-recent: 5
          token: ${{ secrets.PAT }}
          dry-run: ${{ inputs.dry-run || false }}
