name: "Vercel: Build Staging Preview"

on:
  push:
    branches:
      - vercel/deploy


jobs:
  Deploy-Preview:
    name: "Vercel: Deploy Preview Environment"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Deps
        run: |
          yarn global add sass
          yarn install --frozen-lockfile
          clojure -P -M:frontend
          yarn css:minify
          yarn shadow-cljs release app
      
